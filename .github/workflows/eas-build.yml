name: EAS Build - Android APK

on:
  push:
    branches:
      - main
      - development
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ./mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Start EAS build
        id: build
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          BUILD_JSON=$(eas build \
            --profile development \
            --platform android \
            --non-interactive \
            --json \
            --no-wait)

          BUILD_URL=$(echo "$BUILD_JSON" | jq -r 'if type == "array" then .[0].buildDetailsPageUrl else .buildDetailsPageUrl end')
          echo "build_url=$BUILD_URL" >> "$GITHUB_OUTPUT"

      - name: Comment build link on commit
        if: steps.build.outputs.build_url != ''
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body:
                `## EAS Build iniciado\n\n` +
                `**Plataforma:** Android APK\n` +
                `**Perfil:** development\n\n` +
                `[Ver progreso del build](${{ steps.build.outputs.build_url }})\n\n` +
                `El APK quedara disponible en expo.dev cuando termine el build.`
            });
